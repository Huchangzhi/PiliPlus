<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PiliPlus Web - a BiliBili third-party client running in the browser.">
  <meta name="theme-color" content="#fb7299">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PiliPlus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PiliPlus Web</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #pili-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #61666d; background: #fff; transition: opacity .2s ease;
    }
    #pili-splash img { width: 96px; height: 96px; }
    /* Flutter web renders media_kit's video as a DOM element. */
    video { object-fit: contain !important; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121212; }
      #pili-splash { background: #121212; color: #a2a7ae; }
    }
  </style>
</head>
<body>
  <div id="pili-splash">
    <img src="icons/Icon-192.png" alt="PiliPlus">
    <div>PiliPlus Web</div>
  </div>
  <script>
    (function () {
      var buildId = 'web-20261026-5';
      try {
        if (localStorage.getItem('pili_build_id') !== buildId) {
          localStorage.setItem('pili_build_id', buildId);
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).finally(function () { location.reload(); });
          return;
        }
      } catch (e) {}
    })();
  </script>
  <script src="pili-config.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      function hideSplash() {
        var splash = document.getElementById('pili-splash');
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 250);
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Never leave the static splash covering an initialization error.
      setTimeout(hideSplash, 12000);
    })();
  </script>
</body>
</html>
